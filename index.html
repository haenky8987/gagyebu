<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <title>우리집 가계부</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">우리집 가계부</div>
      <button class="sync" id="syncBtn" type="button" title="동기화">
        <span class="dot" id="syncDot"></span><span id="syncText">-</span>
      </button>
    </header>
    <main id="view"></main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="list" class="active" type="button"><span class="ti">☰</span><span>내역</span></button>
      <button data-tab="stats" type="button"><span class="ti">▥</span><span>분석</span></button>
      <button data-tab="add" class="add" type="button" aria-label="새 내역 입력"><span>＋</span></button>
      <button data-tab="trips" type="button"><span class="ti">✈</span><span>여행</span></button>
      <button data-tab="settings" type="button"><span class="ti">⚙</span><span>설정</span></button>
    </nav>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="tooltip" class="tooltip hidden"></div>
  <script src="app.js"></script>
</body>
</html>
